name: Daily board

# Rescrape nflverse, rebuild the board, publish it.
#
# GitHub cron is UTC only and Indiana is Eastern, so the clock shifts twice a
# year: 9am Eastern is 13:00 UTC in summer (EDT) and 14:00 UTC in winter (EST).
# Firing on BOTH and then checking the real Eastern hour is the only way to land
# on 9am all year without editing this file every March and November.
on:
  schedule:
    - cron: "0 13 * * *"   # 9am EDT (summer)
    - cron: "0 14 * * *"   # 9am EST (winter)
  workflow_dispatch:       # "Run workflow" button, for when you can't wait

concurrency:
  group: daily-board
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.clock.outputs.go }}
    steps:
      # Checkout comes BEFORE the gate because the gate needs the commit history
      # to know whether today's build already happened.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Has today's build already run?
        id: clock
        run: |
          H=$(TZ=America/New_York date +%H)
          TODAY=$(TZ=America/New_York date +%F)
          echo "Eastern hour is $H, Eastern date is $TODAY"

          # Why this is not an equality check on the hour any more:
          #
          # GitHub queues scheduled runs and delivers them late under load,
          # routinely by minutes and sometimes by over an hour. The old gate
          # required the Eastern hour to be exactly 09, so a run delayed past
          # 14:00 UTC arrived at 10am Eastern and skipped -- and the 14:00 cron
          # is ALREADY 10am Eastern in summer, so it skipped too. Both runs went
          # green, nothing was built, and no failure was reported anywhere. That
          # is how four days went by with a stale board and no red X.
          #
          # So: accept a window instead of an instant, and use the last bot
          # commit's Eastern date to keep it to one build a day. Whichever cron
          # arrives first does the work; the other finds today already done.
          LAST=$(git log -1 --format=%cI --author="TransferSportal Bot" || true)
          if [ -n "$LAST" ]; then
            LAST_DAY=$(TZ=America/New_York date -d "$LAST" +%F)
          else
            LAST_DAY="never"
          fi
          echo "Last bot build was $LAST_DAY"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run. Proceeding."
            echo "go=yes" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_DAY" = "$TODAY" ]; then
            echo "Already built today. Skipping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$H" -ge 9 ] && [ "$H" -le 13 ]; then
            echo "Inside the 9am-1pm Eastern window and today is not built yet. Proceeding."
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Outside the build window. Skipping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'yes'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.clock.outputs.go == 'yes'
        run: pip install --quiet numpy pandas pillow

      - name: Rescrape and rebuild
        if: steps.clock.outputs.go == 'yes'
        env:
          # This is the one that matters. The Odds API is a licensed feed that
          # carries DraftKings prices; the free tier covers this comfortably at
          # roughly 16 credits a slate against 500 a month. Get a key at
          # the-odds-api.com and add it under
          # Settings -> Secrets and variables -> Actions as ODDS_API_KEY.
          #
          # Without it the board still builds, just with an empty odds column.
          # DraftKings' own endpoint is tried as a courtesy and returns 403 to
          # datacenter IPs, which is the site's call and is left alone.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # The crests are generated rather than stored: 123KB of base64 PNG
          # does not compress and is not something anyone can audit in a diff.
          # Regenerated only when absent, so a normal day costs nothing.
          test -f logos.js || python make_logos.py
          python make_logos.py --check
          python update.py 2026
          python odds.py
          python games.py 2026
          # Game logs for the prop tabs. These must never block the board: if the
          # download fails or comes back thin, props.py writes nothing, the prop
          # tabs say they are waiting for data, and the rest of the site builds.
          python props.py 2026 || echo "props.py failed; building without prop tabs today"
          # picks.py runs AFTER games.py because the per-team cap on touchdown
          # picks comes from that game's projected points. It locks this week's
          # picks write-once and grades every week that has finished.
          python picks.py
          # NBA projections from public ESPN data. Never blocks the board: on any failure
          # it keeps the last nba.json and the NFL side builds as normal.
          python nba.py || echo "nba.py failed; keeping the last NBA build"
          # Locks today's best 5 NBA props once, then grades every finished day.
          python nba_picks.py || echo "nba_picks.py failed; keeping the last NBA picks"
          python build.py
          python build_record.py

      - name: Commit only if something real changed
        if: steps.clock.outputs.go == 'yes'
        run: |
          # Every build stamps a fresh "generated" time, so a quiet day still
          # looks like a diff. Committing those would bury the real picks under
          # no-op commits, and this repo's commit history is the public proof
          # that the picks were posted before kickoff. A moved clock alone is
          # not a change.
          python - <<'PY'
          import json, subprocess

          def norm(txt):
              d = json.loads(txt)
              d.pop("generated", None)
              if isinstance(d.get("meta"), dict):
                  d["meta"].pop("generated", None)
              return d

          def unchanged(f):
              old = subprocess.run(["git", "show", f"HEAD:{f}"],
                                   capture_output=True, text=True)
              if old.returncode:
                  return False                      # brand new file is a change
              try:
                  return norm(old.stdout) == norm(open(f, encoding="utf-8").read())
              except Exception:
                  return False                      # can't tell, so commit it

          tracked = subprocess.run(["git", "diff", "--name-only"],
                                   capture_output=True, text=True).stdout.split()
          real = set(subprocess.run(["git", "ls-files", "-o", "--exclude-standard"],
                                    capture_output=True, text=True).stdout.split())

          # The HTML just embeds its JSON, so it is judged by that JSON.
          quiet = {"data.json":   unchanged("data.json")   if "data.json"   in tracked else True,
                   "record.json": unchanged("record.json") if "record.json" in tracked else True}
          skip_if_quiet = {"data.json": "data.json", "index.html": "data.json",
                           "record.json": "record.json", "record.html": "record.json"}
          for f in tracked:
              src = skip_if_quiet.get(f)
              if src and quiet[src]:
                  continue
              real.add(f)

          open("changed.txt", "w").write("\n".join(sorted(real)))
          print("meaningful changes:", sorted(real) or "none")
          PY
          if [ ! -s changed.txt ]; then
            echo "Nothing but the clock moved. Not committing."
            rm -f changed.txt
            exit 0
          fi
          rm -f changed.txt
          WEEK=$(python -c "import json;print(json.load(open('data.json'))['meta']['predict_week'])")
          git config user.name  "TransferSportal Bot"
          git config user.email "bot@transfersportal.invalid"
          git add -A
          git commit -m "Board update: $WEEK ($(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z'))"
          git push

  deploy:
    needs: build
    if: needs.build.outputs.go == 'yes'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Re-resolve the default branch so this picks up the commit the build
          # job just pushed. Named explicitly rather than hardcoding "main",
          # because a repo whose default branch is called anything else would
          # fail here every single morning.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: pages
        uses: actions/deploy-pages@v4
