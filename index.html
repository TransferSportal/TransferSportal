no:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{
  /* black canvas — the page is the void, the numbers are the light */
  --paper:#000000; --card:#0a0b0d; --sunk:#050506; --raise:#101216;
  --ink:#f2f4f7; --ink2:#98a0ab; --ink3:#5c646f;
  --line:#1b1e24; --line2:#111317;
  /* ticker language: green is up, red is down, nothing else competes */
  --pos:#00d47e; --neg:#ff4d5e; --warn:#f0a028; --accent:#00d47e; --accent2:#8b5cf6;
  --posBg:rgba(0,212,126,.10); --negBg:rgba(255,77,94,.10);
  --posLine:#0d5c3c; --negLine:#6e2029;
  --gold:#ffd13c;
  --ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --num:'IBM Plex Mono',ui-monospace,monospace;
  --r:8px;
}
*{box-sizing:border-box}
/* Tells the browser to render everything it draws itself -- scrollbars, the
   panel a <select> drops down, checkbox chrome, autofill -- against dark.
   Without this those surfaces come back white however the elements are styled. */
:root{color-scheme:dark}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ---- native form controls ---- */
/* Left unstyled a <select> renders as a light grey box with black text, which
   was the last white thing on the page. */
select{appearance:none;-webkit-appearance:none;-moz-appearance:none;
  font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--ink);
  background-color:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 28px 6px 11px;cursor:pointer;line-height:1.4;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%235c646f' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center}
select:hover{border-color:var(--ink3)}
select:focus{outline:none;border-color:var(--pos)}
select option{background-color:#0a0b0d;color:var(--ink)}
input[type=checkbox]{accent-color:var(--pos)}
input:focus,button:focus-visible,select:focus-visible{outline:none}
/* Chrome paints autofilled inputs a hard yellow-white; the inset shadow is the
   only reliable way to keep them on the black canvas. */
input:-webkit-autofill,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--ink);
  -webkit-box-shadow:0 0 0 1000px var(--card) inset;
  caret-color:var(--ink)}
textarea::placeholder,input::placeholder{color:var(--ink3)}
::selection{background:rgba(0,212,126,.28);color:var(--ink)}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 100px}

/* masthead — logo left, nothing fights for attention */
/* .mast and .ticker are siblings of .wrap, not children, so they take plain
   padding -- the negative-margin bleed would push them off-canvas on a phone.
   Inner max-width matches .wrap's 940 minus its 20px gutters, so the logo
   lines up exactly with the left edge of the board. */
.mast{border-bottom:1px solid var(--line);padding:0 20px;background:var(--paper)}
.mast-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  max-width:900px;margin:0 auto;padding:16px 0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brandMark{width:34px;height:34px;border-radius:8px;flex:none;display:block}
.wordmark{font-size:19px;font-weight:600;letter-spacing:-.015em;color:var(--ink);line-height:1.15}
.wordmark b{font-weight:600;color:var(--accent)}
.wtag{font-size:11.5px;color:var(--ink3);margin-top:2px}
.meta{font-family:var(--num);font-size:11.5px;color:var(--ink3);text-align:right}
.meta b{color:var(--ink2);font-weight:500}
.recLink{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.recLink:hover{text-decoration-color:var(--pos)}
.meta b.up{color:var(--pos)}
.meta b.down{color:var(--neg)}

/* ticker tape — the day's biggest model-vs-book gaps, green up / red down */
.ticker{padding:0 20px;background:var(--sunk);border-bottom:1px solid var(--line);overflow:hidden}
.tickerIn{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:0;
  font-family:var(--num);font-size:11px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;padding:7px 0}
.tickerIn::-webkit-scrollbar{display:none}
.tickLabel{flex:none;color:var(--ink3);letter-spacing:.7px;padding-right:14px;border-right:1px solid var(--line);margin-right:14px}
.tick{flex:none;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-right:1px solid var(--line2)}
.tick:last-child{border-right:none}
.tickNm{color:var(--ink2)}
.tickVal{font-weight:500}
.tick.up .tickVal{color:var(--pos)}
.tick.down .tickVal{color:var(--neg)}
.tickArrow{font-size:8px;line-height:1}
.tick.up .tickArrow{color:var(--pos)}
.tick.down .tickArrow{color:var(--neg)}

/* tabs */
.tabs{display:flex;gap:4px;margin:20px 0 20px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:none;padding:9px 4px;margin-right:22px;font-family:var(--ui);
  font-size:13.5px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.view{display:none}.view.on{display:block}

/* one control row */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{appearance:none;background:none;border:none;border-right:1px solid var(--line);
  padding:6px 12px;font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--posBg);color:var(--pos);font-weight:600;box-shadow:inset 0 0 0 1px var(--posLine)}
.grow{flex:1}
.link{appearance:none;background:none;border:none;font-family:var(--ui);font-size:12.5px;color:var(--ink3);
  cursor:pointer;padding:4px 0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{color:var(--ink)}
.find{font-family:var(--ui);font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);color:var(--ink);width:150px}
.find::placeholder{color:var(--ink3)}
.find:focus{outline:none;border-color:var(--pos)}

/* adjust panel — closed by default, one line of sliders */
.adjust{display:none;gap:20px;padding:14px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:14px;flex-wrap:wrap}
.adjust.on{display:flex}
.adj{flex:1;min-width:150px}
.adjtop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:7px}
.adjtop b{color:var(--ink);font-weight:500;font-family:var(--num)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--pos);cursor:pointer;border:none}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--pos);cursor:pointer;border:none}

/* the list — the one thing that should dominate the page */
.board{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.row:first-child{padding-top:2px}
.row:hover .nm{color:var(--tc,var(--ink))}
.rk{font-family:var(--num);font-size:12px;color:var(--ink3);width:16px;flex:none;text-align:right}
/* Crest = the team logo, with a coloured code badge sitting behind it that is
   only revealed if both logo variants fail to load. Sizes are driven by the
   wrapper so the table and slate can shrink it without fighting the image. */
.crestWrap{position:relative;width:24px;height:24px;flex:none;display:inline-flex;
  align-items:center;justify-content:center;vertical-align:middle}
/* The chip is what makes every team readable on black. Measured against the
   real art, a dozen marks sit under 90/255 -- Carolina 26, Arizona 41, the
   Giants 42 -- and simply disappear without something behind them. A soft
   off-white rather than pure white so 350 of them don't glare. */
.crestWrap{background:#dfe3e8;border-radius:50%;padding:2px}
.crestWrap .crest{width:100%;height:100%;object-fit:contain;display:block}
.crestWrap.crestFail .crest{display:none}
.crestWrap.crestFail::after{content:attr(data-code);position:absolute;inset:0;border-radius:50%;
  background:var(--cc,#6b7280);color:#fff;font-family:var(--num);font-size:8.5px;font-weight:700;
  letter-spacing:-.3px;display:flex;align-items:center;justify-content:center}
.crest{width:24px;height:24px;object-fit:contain;flex:none}
.who{flex:1;min-width:0}
.nm{font-size:15px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-family:var(--num);font-size:11.5px;color:var(--ink3);margin-top:2px}
.sub b{color:var(--ink2);font-weight:500}
.flag{font-family:var(--ui);font-size:11px;color:var(--ink3);margin-left:6px}
.flag.warn{color:var(--neg)}
.pv{font-family:var(--num);font-size:20px;font-weight:500;letter-spacing:-.02em;color:var(--tc,var(--ink));
  width:52px;text-align:right;flex:none}
.priceCell{width:112px;flex:none;text-align:right}
.odds{width:100%;font-family:var(--num);font-size:12px;text-align:right;padding:5px 8px;border:1px solid var(--line);
  border-radius:5px;background:var(--card);color:var(--ink)}
.odds::placeholder{color:var(--ink3);font-family:var(--ui)}
.odds:focus{outline:none;border-color:var(--pos)}
.odds.p{border-color:var(--pos)}.odds.n{border-color:var(--neg)}
.edge{display:block;margin-top:3px;font-family:var(--num);font-size:10.5px;text-align:right;color:var(--ink3)}
.edge.p{color:var(--pos)}.edge.n{color:var(--neg)}
.row.dim{opacity:.4}

/* detail — everything secondary lives here, only on click */
.det{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:30px;padding:14px 16px 12px}
.pdet td{padding:0;border-bottom:1px solid var(--line2)}
.dk{font-size:10.5px;color:var(--ink3);margin-bottom:9px;line-height:1.5}
.log{display:flex;flex-wrap:wrap;gap:3px}
.g{width:18px;height:18px;border-radius:3px;background:var(--line2);font-family:var(--num);font-size:8.5px;
  display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.g.hit{background:var(--pos);color:#00140c;font-weight:700}
.brk{display:grid;grid-template-columns:70px 1fr 40px;gap:9px;align-items:center;margin-bottom:6px;font-size:11px;color:var(--ink2)}
.brk .t{height:3px;background:var(--line2)}
.brk .t i{display:block;height:100%;background:var(--pos)}
.brk .v{font-family:var(--num);font-size:11px;text-align:right;color:var(--ink)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:var(--num);font-size:10px;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:2px 6px}

/* slate */
.slate{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gm{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gmh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 13px;
  border-bottom:1px solid var(--line);background:var(--sunk)}
.gmt{font-size:13.5px;font-weight:600}
.gmt em{font-style:normal;color:var(--ink3);font-weight:400;margin:0 3px}
.gml{font-family:var(--num);font-size:10.5px;color:var(--ink3)}
.gmb{display:grid;grid-template-columns:1fr 1fr}
.sd{padding:10px 13px}
.sd+.sd{border-left:1px solid var(--line2)}
.sdh{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.sdh img{width:15px;height:15px;object-fit:contain}
.sdh .crestWrap{width:15px;height:15px}
.sdh .crestWrap.crestFail::after{font-size:6px}
.sdh span{font-size:12px;font-weight:600;color:var(--tc,var(--ink))}
.pr{display:flex;justify-content:space-between;gap:6px;padding:2px 0;font-size:11.5px}
.pr span:first-child{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr span:last-child{font-family:var(--num);color:var(--ink)}

/* tables */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--sunk);font-size:10px;font-weight:500;color:var(--ink3);text-align:right;
  padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th:hover{color:var(--ink)}
th.on{color:var(--ink);font-weight:600}
td{font-family:var(--num);font-size:12px;padding:9px 13px;border-bottom:1px solid var(--line2);color:var(--ink2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--sunk)}
.tc{display:flex;align-items:center;gap:8px}
.tc img{width:16px;height:16px;object-fit:contain}
.tc .crestWrap{width:16px;height:16px}
.tc .crestWrap.crestFail::after{font-size:6.5px}
.tc span{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--ink)}
td.max{color:var(--ink);font-weight:500}
td.up,td.down{font-weight:600}
.heatKey{font-size:11.5px;color:var(--ink3);margin:-4px 0 12px;line-height:1.5}
.heatKey .up{color:var(--pos);font-weight:600}
.heatKey .down{color:var(--neg);font-weight:600}
.heatKey i{font-style:italic;color:var(--ink2)}
td.up{color:var(--pos)}td.down{color:var(--neg)}
.betname{font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--ink)}
.betsub{font-family:var(--ui);font-size:10.5px;color:var(--ink3);margin-top:1px}

.primary{appearance:none;border:1px solid var(--pos);background:var(--pos);color:#00140c;border-radius:6px;
  padding:6px 13px;font-family:var(--ui);font-size:12.5px;font-weight:500;cursor:pointer}
.primary:hover{opacity:.85}
.foot{margin-top:26px;padding:16px 0 0;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--ink3)}
.foot b{color:var(--ink2);font-weight:500}
.foot p{margin:0 0 8px;max-width:70ch}.foot p:last-child{margin:0}
.footBrand{font-family:var(--num);font-size:11px;color:var(--ink3);letter-spacing:.3px;
  padding-top:12px;margin-top:6px !important;border-top:1px solid var(--line2)}
.empty{padding:44px 0;text-align:center;color:var(--ink3);font-size:13px}
@media(max-width:640px){
  .mast-in{align-items:flex-start}
  .meta{text-align:left}
  .priceCell{width:88px}
  .pv{width:42px;font-size:17px}
  .det{grid-template-columns:1fr}
}

.calNote{border:1px solid var(--negLine);background:var(--negBg);border-left:3px solid var(--neg);
  border-radius:var(--r);padding:9px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.calNote b{color:var(--neg);font-weight:600}
/* collapsed notices: one line each, so the board starts near the top of a phone */
.noteHead{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  appearance:none;background:none;border:none;padding:0;cursor:pointer;text-align:left;
  font-family:var(--ui);font-size:12.5px;line-height:1.5;color:var(--ink2)}
.noteHead b{font-weight:600}
.alerts .noteHead b{color:var(--ink)}
.noteChev{font-family:var(--num);font-size:13px;color:var(--ink3);flex:none;line-height:1}
.noteHead:hover .noteChev{color:var(--ink)}
.noteBody{margin-top:8px;font-size:12px;line-height:1.65;color:var(--ink2)}

/* context, not a headline -- keep it quiet so the board stays the page */
.alerts:not(:empty){background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:14px}
.alertrow{font-size:11.5px;color:var(--ink2);padding:2px 0}
.alertrow b{color:var(--ink);font-weight:600}
.alerts .dk{font-size:10.5px;margin-bottom:7px}

.signal{font-size:11.5px;color:var(--accent2);margin-top:3px}

th.l,td.l{text-align:left}
.pv2{font-family:var(--num);font-weight:700;color:var(--pos);font-size:14px}
.signal{color:var(--accent2);font-size:11.5px}
tr.prow{cursor:pointer}
tr.prow.dim{opacity:.45}

.badge{display:inline-block;padding:1px 7px;border:1px solid var(--posLine);border-radius:99px;color:var(--pos);font-size:10.5px;background:var(--posBg)}

.badgeCrest{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;color:#fff;font-family:var(--num);font-size:8.5px;font-weight:700;letter-spacing:-.3px}

.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.pcard.dim{opacity:.5}
/* left rail is the position light: green when the model beats the book, red when it doesn't */
.pcardTop{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer;border-left:3px solid var(--eg,var(--line))}
.pcardTop:hover{background:var(--raise)}
.pcardTop .rk{font-family:var(--num);font-size:12px;color:var(--ink3);padding-top:3px;flex:none}
.pcardMid{flex:1;min-width:0}
.pcardName{display:flex;align-items:center;gap:7px;font-size:14.5px}
.pcardName b{font-weight:600;color:var(--ink)}
.posPill{font-family:var(--num);font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
.pcardMeta{font-family:var(--num);font-size:11.5px;color:var(--ink3);margin-top:2px}
.chipRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rchip{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--sunk);cursor:default}
.rchip.good{background:var(--posBg);border-color:var(--posLine);color:var(--pos)}
.rchip.warn{background:rgba(240,160,40,.10);border-color:#6b4a1a;color:var(--warn)}
.rchip.bad{background:var(--negBg);border-color:var(--negLine);color:var(--neg)}
.moreChip{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;border:1px dashed var(--line);color:var(--ink3);background:none;cursor:pointer}
.moreChip:hover{color:var(--accent);border-color:var(--accent)}
.pcardScore{text-align:right;flex:none;padding-top:2px}
.pcardScore .pv2{font-size:22px;line-height:1.1;color:var(--pos)}
.pcardScore .pv2.cold{color:var(--ink2)}
.pcardScore .pv2sub{font-family:var(--num);font-size:10.5px;color:var(--ink3);margin-top:2px}
.pcardFoot{display:flex;align-items:center;gap:16px;padding:9px 16px;background:var(--sunk);border-top:1px solid var(--line2);
  font-family:var(--num);font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.pcardFoot b{color:var(--ink);font-weight:600}
.pcardFoot i{font-style:normal;color:var(--ink3)}
.pcardFoot .odds{width:76px;font-size:11.5px;padding:3px 6px;margin-left:4px}
.pcardFoot .edge{display:inline;margin:0;font-size:11.5px;color:var(--ink3)}
.pcardFoot .edge.p{color:var(--pos);font-weight:600}
.pcardFoot .edge.n{color:var(--neg);font-weight:600}
.arrow{font-size:8.5px;margin-right:2px}
.reasonList{display:flex;flex-direction:column;gap:7px}
.reasonRow{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:12px;padding:6px 9px;border-radius:6px;background:var(--sunk)}
.reasonRow b{font-size:11.5px}
.reasonRow.good b{color:var(--pos)}
.reasonRow.warn b{color:var(--warn)}
.reasonRow.bad b{color:var(--neg)}
.reasonRow span{color:var(--ink2)}
@media(max-width:640px){.reasonRow{grid-template-columns:1fr}}

.msWrap{position:relative}
.msBtn{font-family:var(--ui);font-size:12.5px;font-weight:500;padding:6px 11px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.msBtn:hover{border-color:var(--ink3)}
.msChevron{font-size:9px;color:var(--ink3)}
.msScrim{position:fixed;inset:0;z-index:40;background:transparent}
.msPanel{position:absolute;top:calc(100% + 6px);left:0;z-index:50;width:240px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.msHead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  font-family:var(--num);font-size:10.5px;letter-spacing:.6px;color:var(--ink3);border-bottom:1px solid var(--line2)}
.msHeadLinks{display:flex;gap:6px;font-family:var(--ui);letter-spacing:0}
.msHeadLinks button{background:none;border:none;color:var(--accent);font-size:11px;cursor:pointer;padding:0}
.msList{max-height:260px;overflow-y:auto;padding:6px 0}
.msRow{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;color:var(--ink);cursor:pointer}
.msRow:hover{background:var(--sunk)}
.msRow input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

/* ---- matchup advantage panel (Games tab) ---- */
.gm.gmOn{border-color:var(--accent)}
.mxBox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.mxHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-bottom:10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.mxHead b{color:var(--ink);font-size:17px;font-family:var(--num);margin-right:5px}
.mxSub{display:flex;justify-content:space-between;font-family:var(--num);font-size:10.5px;
  color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:9px 0}
.mxRow{display:grid;grid-template-columns:130px 1fr 92px;align-items:center;gap:12px;
  padding:9px 0;border-top:1px solid var(--line2)}
.mxCat{font-size:13px;font-weight:600}
.mxTrack{position:relative;height:16px}
.mxTrack:before{content:'';position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.mxZero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink3)}
.mxFill{position:absolute;top:3px;height:10px;border-radius:2px}
.mxA{background:var(--pos)} .mxH{background:var(--neg)} .mxEven{background:var(--ink3)}
.mxVal{text-align:right;font-size:12.5px;font-weight:600}
.mxVal .gml{font-weight:400}
@media(max-width:620px){.mxRow{grid-template-columns:96px 1fr 78px;gap:8px}}

/* ---- game card: market vs model, and the pick ---- */
.gmGrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.gmGrid>div{padding:8px 10px;border-left:1px solid var(--line2)}
.gmGrid>div:first-child{border-left:0}
.gmk{display:block;font-family:var(--num);font-size:9px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.gmGrid b{font-family:var(--num);font-size:12.5px}
.gmPick{padding:9px 11px;border-top:1px solid var(--line);background:var(--posBg)}
.gmPick b{font-family:var(--num);font-size:14px;color:var(--pos)}
.gmWin{display:flex;justify-content:space-between;align-items:center;
  padding:8px 11px;border-top:1px solid var(--line)}
.gmWin b{font-size:12.5px}
@media(max-width:620px){.gmGrid{grid-template-columns:repeat(2,1fr)}
  .gmGrid>div:nth-child(3){border-left:0}}

/* ===== The Card: locked picks and the graded record ===== */
.cardGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cardTeam{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px}
.cardTeamHead{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.cardTeamName{font-weight:700;font-size:15px;letter-spacing:.02em}
.cardTeamMeta{font-size:11px;color:var(--ink2);font-family:var(--num)}
.cardPick{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;
  padding:4px 0;font-size:13px}
.cardPickN{font-family:var(--num);font-size:11px;color:var(--ink2)}
.cardPickName{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardPickPos{font-family:var(--num);font-size:11px;color:var(--ink2)}
.cardPickProb{font-family:var(--num);font-size:12px;color:var(--pos);font-weight:700}

.cardGames{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cardGame{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px}
.cardGameTeams{font-weight:700;font-size:14px}
.cardGameTeams em{font-style:normal;color:var(--ink2);margin:0 4px}
.cardGameLine{font-family:var(--num);font-size:11px;color:var(--ink2);margin:2px 0 8px}
.cardGamePick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.cardGamePick b{color:var(--pos)}
.cardTag{font-family:var(--num);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink2)}
.cardTag.dog{color:var(--warn);border-color:var(--warn)}
.cardOu{font-family:var(--num);font-size:12px;color:var(--ink2);margin-left:auto}

.recTotals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;
  margin-bottom:14px}
.recBox{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:12px 14px}
.recLbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.recNum{font-size:26px;font-weight:700;font-family:var(--num);margin:4px 0 2px}
.recSub{font-size:11px;color:var(--ink2);font-family:var(--num)}
.recWeek{border:1px solid var(--line);border-radius:10px;background:var(--card);
  margin-bottom:10px;overflow:hidden}
.recWeekHead{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.recWeekHead span{font-family:var(--num);font-size:11px;color:var(--ink2)}
.recWeekBody{padding:4px 12px 10px}
.recGame{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:3px 0;font-size:12px;border-bottom:1px solid transparent}
.recGame em{font-style:normal;color:var(--ink2);font-family:var(--num);font-size:11px}
.recRes{font-family:var(--num);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.recRes.win{color:var(--pos)}
.recRes.loss{color:var(--neg)}
.recRes.push{color:var(--ink2)}
@media(max-width:560px){
  .cardGrid,.cardGames{grid-template-columns:1fr}
  .recGame{grid-template-columns:1fr auto}
  .recGame span:last-child{display:none}
}

.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none}
b.up{color:var(--pos)}b.down{color:var(--neg)}

/* Light theme: white page, black type, grey for neutral. Green means good,
   red means bad, grey means neutral, and nothing else carries colour.
   Loaded after theme.css by build.py, so these only override the dark values. */
:root{
  --paper:#ffffff; --card:#ffffff; --sunk:#f6f6f7; --raise:#f1f1f2;
  --ink:#0b0b0c; --ink2:#55585e; --ink3:#8a8d93;
  --line:#e3e4e6; --line2:#eeeff0;
  --pos:#12a150; --neg:#dc2626; --warn:#6b6f76; --accent:#0b0b0c; --accent2:#55585e;
  --posBg:rgba(18,161,80,.09); --negBg:rgba(220,38,38,.08);
  --posLine:#9bd8b4; --negLine:#f0aaaa;
  --gold:#0b0b0c;
  color-scheme:light;
}
:root{color-scheme:light}
select option{background-color:#fff;color:var(--ink)}
select{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%238a8d93' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E")}
::selection{background:rgba(0,0,0,.14);color:var(--ink)}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #fff inset}
input:focus,select:focus,.find:focus,.odds:focus{border-color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff;box-shadow:none}
.wordmark b{color:var(--ink)}
.crestWrap{background:#eceef0}
.g.hit{color:#fff}
.primary{color:#fff;background:var(--ink);border-color:var(--ink)}
.rchip.warn{background:var(--sunk);border-color:var(--line);color:var(--ink2)}
.posPill{color:var(--ink);border-color:var(--ink)}
.msPanel{box-shadow:0 8px 24px rgba(0,0,0,.12)}
.mxEven{background:#b4b7bc}
tbody tr:hover td{background:var(--sunk)}
.pcardTop:hover{background:var(--sunk)}
.badge{color:var(--pos)}
.tickLabel{color:var(--ink3)}
.dk{color:var(--ink2)}

/* matchup line on a cheatsheet row: green good, red bad, grey neutral */
td.mu{border-left:4px solid #c9cbcf}
td.mu.good{border-left-color:var(--pos)}
td.mu.bad{border-left-color:var(--neg)}
.muKey{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 10px}
.muKey i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:#c9cbcf}
.muKey i.g{background:var(--pos)}.muKey i.r{background:var(--neg)}

/* the locked-card notice is information, not a warning: no red */
.calNote{background:var(--sunk);border-color:var(--line);border-left:3px solid var(--ink)}
.calNote b{color:var(--ink)}

    const clean = line.replace(/−/g,'-');
    const inline = clean.match(/^(.*?[A-Za-z].*?)[\s\t|,]+([+-]\d{2,4})\s*$/);
    if (inline) { flush(); pairs.push([inline[1],[inline[2]]]); return; }
    if (priceRe.test(clean)) { if (pending) bucket.push(clean.replace('−','-')); return; }
    if (/[A-Za-z]{2,}/.test(clean)) { flush(); pending = clean; }
  });
  flush();
  const ORDER = ['anytime','first_td','two_plus'];
  pairs.forEach(([rawName, prices]) => {
    let nm = rawName.replace(/\b(anytime|atd|td|scorer|yes|no|first|2\+|tds)\b/gi,'')
      .replace(/\([^)]*\)/g,'').replace(/[|,]/g,' ').replace(/\s{2,}/g,' ').trim();
    const teamHit = nm.match(/\b([A-Z]{2,3})\b\s*$/); let team=null;
    if (teamHit && teamHit[1]!==nm.trim()) { team=teamHit[1]; nm=nm.slice(0,teamHit.index).trim(); }
    if (nm.length<3) return;
    let hit=null;
    for (const [map,key] of [[idx.e,pnorm(nm)],[idx.t,ptight(nm)],[idx.l,pinit(nm)]]) {
      let cands = map[key] || [];
      if (team && cands.filter(p=>p.team===team).length) cands = cands.filter(p=>p.team===team);
      if (cands.length===1) { hit=cands[0]; break; }
      if (cands.length>1) { ambiguous.push(nm); return; }
    }
    if (!hit) { unmatched.push(nm); return; }
    prices.slice(0,3).forEach((raw,i) => { const v=parseInt(raw,10); applied[ORDER[i]][hit.name]=(v>0?'+':'')+v; });
  });
  return { applied, unmatched, ambiguous, found: pairs.length };
}

// American-odds equivalent of a probability, matching how a sportsbook would price it.
function probToAmerican(p) {
  if (p == null || p <= 0 || p >= 1) return null;
  return p >= 0.5 ? Math.round(-100 * p / (1 - p)) : Math.round(100 * (1 - p) / p);
}

// ============ Ticker tape ============
// The biggest disagreements between the model and the posted book price, the
// way a market screen shows its movers. Every number here is already computed:
// model probability run through the calibration curve, minus the book's
// implied probability. Green means the model is higher than the price.
function Ticker({ DATA, CURVE, CALP, CAL, CALPP, CALP2 }) {
  const ticks = useMemo(() => {
    const out = [];
    (DATA.players || []).forEach(p => {
      if (p.rostered === false || p.dk_odds == null) return;
      const { prob } = scoreOf(p, { wSea:32, wRZ:32, wYD:20, wTT:16 }, CALP, CAL, CALPP, CALP2);
      const b = betOf(p, prob, String(p.dk_odds), CURVE);
      if (!b) return;
      out.push({ name: p.name, team: p.team, value: b.value });
    });
    // Gainers and losers separately, the way a movers strip works. Sorting by
    // raw size would show only red: with one week of data the model shrinks
    // stars hard toward the positional mean, so the biggest gaps are all fades.
    out.sort((a, b) => b.value - a.value);
    return [...out.slice(0, 8), ...out.slice(-5)];
  }, [DATA, CURVE, CALP, CAL]);

  if (!ticks.length) return null;
  const last = n => { const s = n.split(' '); return s.length > 1 ? s[0][0] + '.' + s[s.length-1] : n; };
  return (
    <div className="ticker">
      <div className="tickerIn">
        <span className="tickLabel">EDGE</span>
        {ticks.map(t => (
          <span className={'tick ' + (t.value >= 0 ? 'up' : 'down')} key={t.name}>
            <span className="tickNm">{last(t.name)}</span>
            <span className="tickVal">
              <span className="tickArrow">{t.value >= 0 ? '▲' : '▼'}</span>
              {t.value >= 0 ? '+' : ''}{t.value.toFixed(1)}%
            </span>
          </span>
        ))}
      </div>
    </div>
  );
}

// ============ Calibration notice ============
// Measures, live from the shipped prices, how far the model sits below the book
// at each price tier. Early in the season the shrinkage compresses every rate
// toward the positional mean, so the model cannot reach the high probabilities
// the book posts on workhorses -- which makes a big negative "edge" on chalk an
// artifact, not a fade. This checks for that rather than assuming it, so once
// enough weeks accumulate and the gap closes, the notice stops rendering.
function CalibrationNote({ DATA, CURVE, CALP, CAL, CALPP, CALP2 }) {
  const gap = useMemo(() => {
    const chalk = [];
    (DATA.players || []).forEach(p => {
      if (p.rostered === false || p.dk_odds == null) return;
      // measured against the devigged price, same as the edge column, so the
      // notice reports a real calibration gap and not the book's cut
      const bk = (p.fair_prob != null ? p.fair_prob : impl(+p.dk_odds)) * 100;
      if (bk < 45) return;
      const { prob } = scoreOf(p, { wSea:32, wRZ:32, wYD:20, wTT:16 }, CALP, CAL, CALPP, CALP2);
      chalk.push(trueRate(prob*100, CURVE) - bk);
    });
    if (chalk.length < 8) return null;
    return chalk.reduce((a, b) => a + b, 0) / chalk.length;
  }, [DATA, CURVE, CALP, CAL]);

  const [open, setOpen] = useState(false);
  if (gap == null || gap > -8) return null;
  const wk = DATA.meta.weeks_played || 1;
  return (
    <div className="calNote">
      <button className="noteHead" onClick={()=>setOpen(v=>!v)}>
        <span><b>Read the edge with care on favourites</b> — the model sits {Math.abs(gap).toFixed(0)} pts under the book on short prices</span>
        <span className="noteChev">{open ? '−' : '+'}</span>
      </button>
      {open && (
        <div className="noteBody">
          On players the book prices at 45% or better, the model is averaging {Math.abs(gap).toFixed(0)} points
          below the market. With {wk} week{wk === 1 ? '' : 's'} of data, most of each player's rate is still the
          positional average, so the model cannot reach the numbers the book posts on workhorses. Treat a big red
          edge on a short price as the sample talking, not a fade. Edges on longshots are the ones worth reading —
          there the model and the book currently agree to within a point.
        </div>
      )}
    </div>
  );
}

// ============ Prop tabs: Cheatsheets, Parlay Builder, Injuries ============
//
// All three read DATA.props, which props.py builds from nflverse weekly stats:
// every eligible player's last 12 games (this season and last), with the
// opponent and home/away for each. Nothing here is a posted line. DraftKings
// prices are not loaded, so every hit rate is against a number the reader picks,
// and the detail panels let them type the real line and the real odds.
//
// A player's "hit" at a number T is a game where the stat reached T or more.
// That reads "40+ receiving yards", which is the same as Over 39.5.
//
// These are function declarations on purpose: the three files are joined into
// one script block, and declarations hoist across the join.

const PM = [
  { k: 'ry',  label: 'Receiving yards', ix: 4,  pos: ['WR','TE','RB'], from: 10,  to: 150, step: 5, unit: 'rec yds' },
  { k: 'rc',  label: 'Receptions',      ix: 5,  pos: ['WR','TE','RB'], from: 2,   to: 11,  step: 1, unit: 'rec' },
  { k: 'ruy', label: 'Rushing yards',   ix: 7,  pos: ['RB','QB'],      from: 10,  to: 120, step: 5, unit: 'rush yds' },
  { k: 'ra',  label: 'Rush attempts',   ix: 8,  pos: ['RB'],           from: 4,   to: 25,  step: 1, unit: 'carries' },
  { k: 'py',  label: 'Passing yards',   ix: 9,  pos: ['QB'],           from: 150, to: 350, step: 5, unit: 'pass yds' },
  { k: 'pc',  label: 'Completions',     ix: 10, pos: ['QB'],           from: 12,  to: 32,  step: 1, unit: 'cmp' },
  { k: 'td',  label: 'Anytime TD',      ix: 12, pos: ['RB','WR','TE','QB'], from: 1, to: 1, step: 1, unit: 'TD' },
];
const PM_BY = Object.fromEntries(PM.map(m => [m.k, m]));

function pmLadder(m) {
  const out = [];
  for (let t = m.to; t >= m.from; t -= m.step) out.push(t);
  return out;
}
function pmRate(vals, T) {
  const n = vals.length;
  let k = 0;
  for (const v of vals) if (v >= T) k++;
  return [k, n];
}
// Lower end of a 95% Wilson interval: what the hit rate could plausibly be on a
// sample this small. 8 of 8 is not "100%", it is "at least about 68%".
function wilsonLow(k, n) {
  if (!n) return 0;
  const z = 1.96, p = k / n, d = 1 + z * z / n;
  const c = p + z * z / (2 * n);
  const w = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
  return Math.max(0, (c - w) / d);
}
function pctStr(x) { return Math.round(x * 100) + '%'; }
function medianOf(a) {
  if (!a.length) return 0;
  const s = a.slice().sort((x, y) => x - y), h = Math.floor(s.length / 2);
  return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
}
// Games for one player, split the three ways a cheatsheet cares about.
function pmSets(p, formN) {
  const g = p.g || [];
  return {
    form: g.slice(-formN),
    opp: g.filter(r => r[2] === p.opp),
    venue: g.filter(r => r[3] === p.h),
  };
}
const PM_MIN = { form: 5, opp: 2, venue: 3 };
// Matchup colour for a row: how the player did at this number against this week's opponent.
function muClass(o) {
  if (!o || o[1] < 2) return '';
  const r = o[0] / o[1];
  return r >= 0.8 ? 'good' : r < 0.5 ? 'bad' : '';
}

function pmBest(p, m, sets, mode, minRate) {
  const need = mode === 'all' ? ['form', 'opp', 'venue'] : [mode];
  for (const T of pmLadder(m)) {
    let ok = true;
    for (const s of need) {
      const vals = sets[s].map(r => r[m.ix]);
      if (vals.length < PM_MIN[s]) { ok = false; break; }
      const [k, n] = pmRate(vals, T);
      if (k / n < minRate) { ok = false; break; }
    }
    if (ok) return T;
  }
  return null;
}

function Bars({ games, ix, line, opp }) {
  // One bar per game, oldest left. Green cleared the line, red did not.
  const vals = games.map(r => r[ix]);
  const top = Math.max(line * 1.25, ...vals, 1);
  const W = 560, H = 150, pad = 22, bw = Math.min(34, (W - pad) / Math.max(vals.length, 1) - 6);
  const y = v => H - 18 - (v / top) * (H - 36);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', maxWidth: 620, display: 'block' }} role="img"
         aria-label="Last games against the line">
      {vals.map((v, i) => {
        const x = pad + i * ((W - pad) / vals.length) + 3;
        const hit = v > line;
        const r = games[i];
        return (
          <g key={i}>
            <rect x={x} y={y(v)} width={bw} height={Math.max(H - 18 - y(v), 1)} rx="2"
                  fill={hit ? 'var(--pos)' : 'var(--neg)'} opacity={r[2] === opp ? 1 : 0.7} />
            <text x={x + bw / 2} y={y(v) - 4} fontSize="10" textAnchor="middle" fill="var(--ink2)">{v}</text>
            <text x={x + bw / 2} y={H - 5} fontSize="9" textAnchor="middle" fill="var(--ink3)">{(r[3] ? '' : '@') + r[2]}</text>
          </g>
        );
      })}
      <line x1={pad - 4} x2={W} y1={y(line)} y2={y(line)} stroke="var(--gold)" strokeWidth="1.5" strokeDasharray="4 3" />
    </svg>
  );
}

function CheatsheetsTab({ DATA }) {
  const P = DATA.props;
  const [mk, setMk] = useState('ry');
  const [mode, setMode] = useState('form');
  const [minRate, setMinRate] = useState(1);
  const [formN, setFormN] = useState(10);
  const [minPct, setMinPct] = useState(0.7);
  const [pos, setPos] = useState('ALL');
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(null);
  const m = PM_BY[mk];

  const rows = useMemo(() => {
    if (!P) return [];
    const out = [];
    for (const p of P.players) {
      if (!m.pos.includes(p.pos)) continue;
      if (pos !== 'ALL' && p.pos !== pos) continue;
      if (q && !(p.n + ' ' + p.tm).toLowerCase().includes(q.toLowerCase())) continue;
      const sets = pmSets(p, formN);
      const T = pmBest(p, m, sets, mode, minRate);
      if (T == null) continue;
      const at = s => pmRate(sets[s].map(r => r[m.ix]), T);
      const f = at('form'), o = at('opp'), v = at('venue');
      const avg = sets.form.length ? sets.form.reduce((a, r) => a + r[m.ix], 0) / sets.form.length : 0;
      if (m.k !== 'td' && avg > 0 && T / avg < minPct) continue;
      out.push({ p, T, f, o, v, avg, pct: avg > 0 ? T / avg : 0 });
    }
    const key = x => (mode === 'opp' ? x.o : mode === 'venue' ? x.v : x.f);
    out.sort((a, b) => {
      const ka = key(a), kb = key(b);
      return (kb[0] / kb[1] - ka[0] / ka[1]) || (kb[1] - ka[1]) || (b.avg - a.avg);
    });
    return out;
  }, [P, mk, mode, minRate, formN, minPct, pos, q]);

  if (!P) return <section className="view on"><div className="dk">Prop data has not been built yet. It arrives with the next daily build.</div></section>;
  const modes = [['form', 'Recent form'], ['opp', 'Vs opponent'], ['venue', 'Home / away'], ['all', 'All three']];
  return (
    <section className="view on">
      <div className="bar">
        <div className="seg">
          {modes.map(([k, l]) => <button key={k} className={mode === k ? 'on' : ''} onClick={() => setMode(k)}>{l}</button>)}
        </div>
        <select value={mk} onChange={e => { setMk(e.target.value); setOpen(null); }}>
          {PM.map(x => <option key={x.k} value={x.k}>{x.label}</option>)}
        </select>
        <select value={minRate} onChange={e => setMinRate(parseFloat(e.target.value))}>
          <option value={1}>Hit 100%</option><option value={0.9}>Hit 90%+</option><option value={0.8}>Hit 80%+</option>
        </select>
        <select value={formN} onChange={e => setFormN(parseInt(e.target.value))}>
          <option value={5}>Last 5</option><option value={10}>Last 10</option><option value={12}>Last 12</option>
        </select>
        <select value={minPct} onChange={e => setMinPct(parseFloat(e.target.value))}>
          <option value={0}>Any line</option><option value={0.5}>Line 50%+ of avg</option><option value={0.7}>Line 70%+ of avg</option>
          <option value={0.8}>Line 80%+ of avg</option><option value={0.9}>Line 90%+ of avg</option>
        </select>
        <select value={pos} onChange={e => setPos(e.target.value)}>
          <option value="ALL">All positions</option>
          {['QB', 'RB', 'WR', 'TE'].filter(x => m.pos.includes(x)).map(x => <option key={x} value={x}>{x}</option>)}
        </select>
        <span className="grow" />
        <input className="find" placeholder="Search player or team" value={q} onChange={e => setQ(e.target.value)} />
      </div>
      <div className="dk" style={{ marginBottom: 10 }}>
        {P.week}: the highest number each player has cleared {mode === 'all' ? 'in recent form, against this opponent and at this venue' : mode === 'opp' ? 'in games against this week’s opponent (2+ games)' : mode === 'venue' ? 'at this week’s venue (3+ games)' : 'in the last ' + formN + ' games (5+ games)'}, through {P.through}.
        No lines are loaded. Tap a row, type the DraftKings number, and the chart and hit rates redraw against it.
        A perfect record at a number far below the player&rsquo;s average is real but useless, because books do not post those numbers at a price worth taking, so the line-to-average filter hides them by default.
      </div>
      <div className="muKey">
        <span><i className="g" />Good matchup: cleared this number in 80%+ of games against this opponent</span>
        <span><i className="r" />Bad matchup: under 50%</span>
        <span><i />Neutral, or too few games against them</span>
      </div>
      {open && <PropDetail key={open.n + mk} p={open} m={m} T0={open.T0} onClose={() => setOpen(null)} />}
      <div className="tbl">
        <table>
          <thead><tr>
            <th className="l">Player</th><th className="l">Game</th><th className="l">Prop</th>
            <th>Recent</th><th>Vs opp</th><th>{`Home/away`}</th><th>Avg</th><th>Line / avg</th>
          </tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.p.n + r.p.tm} onClick={() => setOpen({ ...r.p, T0: r.T })} style={{ cursor: 'pointer' }}>
                <td className={'l mu ' + muClass(r.o)}><b>{r.p.n}</b> <span className="sub">{r.p.pos}</span>{r.p.st ? <span className="sub"> &middot; {r.p.st}</span> : null}</td>
                <td className="l">{r.p.tm} {r.p.h ? 'vs' : '@'} {r.p.opp}</td>
                <td className="l"><b>{m.k === 'td' ? 'Anytime TD' : r.T + '+ ' + m.unit}</b></td>
                <td>{r.f[0]}/{r.f[1]}</td>
                <td>{r.o[1] ? r.o[0] + '/' + r.o[1] : '—'}</td>
                <td>{r.v[1] ? r.v[0] + '/' + r.v[1] : '—'}</td>
                <td>{r.avg.toFixed(1)}</td>
                <td>{m.k === 'td' ? '—' : pctStr(r.pct)}</td>
              </tr>
            ))}
            {!rows.length && <tr><td colSpan={8} className="empty">Nobody clears that bar. Loosen the hit rate, lower the line-to-average floor, or switch the window.</td></tr>}
          </tbody>
        </table>
      </div>
    </section>
  );
}

// ---------------------------------------------------------------- parlay builder
function americanToProb(o) {
  if (!Number.isFinite(o) || o === 0) return null;
  return o < 0 ? -o / (-o + 100) : 100 / (o + 100);
}
// probToAmerican comes from App.jsx.

function PairDetail({ pr, onClose }) {
  const [txt, setTxt] = useState('');
  const o = parseFloat(txt);
  const imp = americanToProb(o);
  const [k, n] = pr.joint;
  const hist = n ? k / n : 0;
  const low = wilsonLow(k, n);
  return (
    <div className="dk" style={{ margin: '0 0 12px', padding: 14 }}>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
        <b style={{ fontSize: 15, color: 'var(--ink)' }}>{pr.qb.n} + {pr.rc.n}</b>
        <span>{pr.qb.tm} {pr.qb.h ? 'vs' : '@'} {pr.qb.opp}</span>
        <span className="grow" />
        <button className="link" onClick={onClose}>Close</button>
      </div>
      <div style={{ margin: '8px 0' }}>
        {pr.qT}+ {PM_BY[pr.qm].unit} and {pr.cT}+ {PM_BY[pr.cm].unit}, together in {k} of {n} shared games ({pctStr(hist)}).
        If you assumed the legs were independent you would get {pctStr(pr.indep)}.
        With a sample this size the real rate could be as low as about {pctStr(low)}.
      </div>
      <label>DraftKings price for the pair (American odds)&nbsp;
        <input className="find" style={{ width: 90 }} value={txt} inputMode="numeric" placeholder="-250" onChange={e => setTxt(e.target.value)} />
      </label>
      {imp != null && (
        <div style={{ marginTop: 8 }}>
          That price implies {pctStr(imp)}. Past games say {pctStr(hist)}, conservative {pctStr(low)}.{' '}
          {low > imp
            ? <b className="up">Beats the price even on the conservative read.</b>
            : hist > imp
              ? <b>Beats the price on the raw record only. The sample is too thin to lean on.</b>
              : <b className="down">The price is shorter than the record. No edge here.</b>}
          {' '}Break-even on the raw record is about {probToAmerican(hist) || '—'}.
        </div>
      )}
      <div className="sub" style={{ marginTop: 8 }}>
        Past games are a record, not a forecast. Check that both players are active before you bet.
      </div>
    </div>
  );
}

function ParlayTab({ DATA }) {
  const P = DATA.props;
  const [minRate, setMinRate] = useState(0.8);
  const [formN, setFormN] = useState(10);
  const [minPct, setMinPct] = useState(0.7);
  const [qm, setQm] = useState('py');
  const [cm, setCm] = useState('ry');
  const [open, setOpen] = useState(null);

  const rows = useMemo(() => {
    if (!P) return [];
    const out = [];
    const QM = PM_BY[qm], CM = PM_BY[cm];
    const byTeam = {};
    for (const p of P.players) (byTeam[p.tm] = byTeam[p.tm] || []).push(p);
    for (const tm of Object.keys(byTeam)) {
      const qbs = byTeam[tm].filter(p => p.pos === 'QB');
      const rcs = byTeam[tm].filter(p => ['WR', 'TE', 'RB'].includes(p.pos));
      for (const qb of qbs) for (const rc of rcs) {
        // only games both played, matched on season and week
        const key = r => r[0] + '-' + r[1];
        const rcMap = new Map(rc.g.map(r => [key(r), r]));
        const both = qb.g.map(r => [r, rcMap.get(key(r))]).filter(x => x[1]).slice(-formN);
        if (both.length < 6) continue;
        const pick = (ix, M, which) => {
          for (const T of pmLadder(M)) {
            const [k, n] = pmRate(both.map(x => x[which][ix]), T);
            if (k / n >= minRate) return T;
          }
          return null;
        };
        const qT = pick(QM.ix, QM, 0), cT = pick(CM.ix, CM, 1);
        if (qT == null || cT == null) continue;
        const mean = (ix, w) => both.reduce((a, x) => a + x[w][ix], 0) / both.length;
        const qa = mean(QM.ix, 0), ca = mean(CM.ix, 1);
        if ((qa > 0 && qT / qa < minPct) || (ca > 0 && cT / ca < minPct)) continue;
        const qk = pmRate(both.map(x => x[0][QM.ix]), qT)[0];
        const ck = pmRate(both.map(x => x[1][CM.ix]), cT)[0];
        const jk = both.filter(x => x[0][QM.ix] >= qT && x[1][CM.ix] >= cT).length;
        out.push({ qb, rc, qm, cm, qT, cT, q: [qk, both.length], c: [ck, both.length], joint: [jk, both.length],
                   indep: (qk / both.length) * (ck / both.length) });
      }
    }
    out.sort((a, b) => (b.joint[0] / b.joint[1] - a.joint[0] / a.joint[1]) || (b.joint[1] - a.joint[1]));
    return out;
  }, [P, minRate, formN, minPct, qm, cm]);

  if (!P) return <section className="view on"><div className="dk">Prop data has not been built yet. It arrives with the next daily build.</div></section>;
  return (
    <section className="view on">
      <div className="bar">
        <select value={qm} onChange={e => setQm(e.target.value)}>
          <option value="py">QB passing yards</option><option value="pc">QB completions</option>
        </select>
        <select value={cm} onChange={e => setCm(e.target.value)}>
          <option value="ry">Catcher receiving yards</option><option value="rc">Catcher receptions</option>
        </select>
        <select value={minRate} onChange={e => setMinRate(parseFloat(e.target.value))}>
          <option value={0.9}>Each leg 90%+</option><option value={0.8}>Each leg 80%+</option><option value={0.7}>Each leg 70%+</option>
        </select>
        <select value={minPct} onChange={e => setMinPct(parseFloat(e.target.value))}>
          <option value={0}>Any line</option><option value={0.5}>Lines 50%+ of avg</option><option value={0.7}>Lines 70%+ of avg</option>
          <option value={0.8}>Lines 80%+ of avg</option><option value={0.9}>Lines 90%+ of avg</option>
        </select>
        <select value={formN} onChange={e => setFormN(parseInt(e.target.value))}>
          <option value={8}>Last 8 together</option><option value={10}>Last 10 together</option><option value={12}>Last 12 together</option>
        </select>
      </div>
      <div className="dk" style={{ marginBottom: 10 }}>
        {P.week}: a quarterback and one of his own pass catchers. Both legs go up together when the offence has a big day, which is why a same-game
        parlay of the two should pay less than two separate bets, and why the joint record matters more than the two single records.
        Only games both players played count. Tap a pair, type the DraftKings price, and the page tells you whether the record beats it.
      </div>
      {open && <PairDetail key={open.qb.n + open.rc.n} pr={open} onClose={() => setOpen(null)} />}
      <div className="tbl">
        <table>
          <thead><tr>
            <th className="l">Game</th><th className="l">Quarterback</th><th className="l">Catcher</th>
            <th>QB leg</th><th>Catcher leg</th><th>Together</th>
          </tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.qb.n + r.rc.n} onClick={() => setOpen(r)} style={{ cursor: 'pointer' }}>
                <td className="l">{r.qb.tm} {r.qb.h ? 'vs' : '@'} {r.qb.opp}</td>
                <td className="l"><b>{r.qb.n}</b> {r.qT}+ {PM_BY[qm].unit}</td>
                <td className="l"><b>{r.rc.n}</b> <span className="sub">{r.rc.pos}</span> {r.cT}+ {PM_BY[cm].unit}</td>
                <td>{r.q[0]}/{r.q[1]}</td><td>{r.c[0]}/{r.c[1]}</td>
                <td><b>{r.joint[0]}/{r.joint[1]}</b></td>
              </tr>
            ))}
            {!rows.length && <tr><td colSpan={6} className="empty">No pair clears that bar together. Loosen the hit rate or the line-to-average floor.</td></tr>}
          </tbody>
        </table>
      </div>
    </section>
  );
}

// ---------------------------------------------------------------- the card's touchdown list
// The card is the 15 highest-probability scorers on the slate. Picks for games that
// had already kicked off when the card was cut down stay on the record untouched, and
// are listed apart from the live 15.
function tdSplit(P) {
  const frozen = new Set(((P.amendments) || []).flatMap(a => a.frozen_teams || []));
  const all = P.td_picks || [];
  const byProb = (a, b) => (b.prob || 0) - (a.prob || 0);
  return {
    live: all.filter(p => !frozen.has(p.team)).sort(byProb),
    played: all.filter(p => frozen.has(p.team)).sort(byProb),
  };
}
function tdCount(P) { return tdSplit(P).live.length; }

function TopPicksView({ P }) {
  const { live, played } = tdSplit(P);
  const row = (p, i, n) => (
    <tr key={p.name + p.team}>
      <td className="l">{n}</td>
      <td className="l"><b>{p.name}</b></td>
      <td className="l">{p.pos}</td>
      <td className="l">{p.team}{p.opp ? ' vs ' + p.opp : ''}</td>
      <td><b>{Math.round((p.prob || 0) * 100)}%</b></td>
    </tr>
  );
  const head = (
    <thead><tr><th className="l">#</th><th className="l">Player</th><th className="l">Pos</th>
      <th className="l">Game</th><th>Model chance</th></tr></thead>
  );
  return (
    <>
      <div className="tbl"><table>{head}<tbody>{live.map((p, i) => row(p, i, i + 1))}</tbody></table></div>
      {played.length > 0 && (
        <>
          <div className="dk" style={{ margin: '16px 0 8px' }}>
            Already played when the card was cut to 15. These stay on the record exactly as first locked.
          </div>
          <div className="tbl"><table>{head}<tbody>{played.map((p, i) => row(p, i, '-'))}</tbody></table></div>
        </>
      )}
    </>
  );
}

/*
 * TransferSportal — the tabs and the root component.

 * Second half of the dashboard; App.jsx is the first. build.py concatenates

 * defined there.

// ============ Predictions tab ============
// Every chip below is derived from fields the model already computes -- nothing
// invented for display. Tone drives color: good=favorable, warn=caution, bad=against.
function reasons(p, m) {
  const out = [];
  if (p.rostered === false) { out.push({ label: p.out_reason || 'Unavailable', tone: 'bad', detail: 'Not on the active roster right now.' }); return out; }
  if (p.gl_pg >= 0.8) out.push({ label: 'Goal-line role', tone: 'good', detail: `Averaging ${p.gl_pg.toFixed(1)} touches inside the 5 per game.` });
  if (p.rz_pg >= 1.5) out.push({ label: 'Red-zone volume', tone: 'good', detail: `${p.rz_pg.toFixed(1)} touches inside the 10 per game.` });
  if (p.games >= 3 && p.td_games / p.games >= 0.5) out.push({ label: 'Proven scorer', tone: 'good', detail: `Scored in ${p.td_games} of ${p.games} games this season.` });
  if (m && m.mu != null) {
    if (m.mu >= 1.15) out.push({ label: 'Soft matchup', tone: 'good', detail: `${p.next_opp} allows ${m.defY.toFixed(0)} ${m.label} yds/g to ${p.pos}s${m.soft?` (${ord(m.soft)} most in the league)`:''}.` });
    else if (m.mu <= 0.85) out.push({ label: 'Tough matchup', tone: 'bad', detail: `${p.next_opp} allows just ${m.defY.toFixed(0)} ${m.label} yds/g to ${p.pos}s.` });
  }
  if (p.itt != null) {
    if (p.itt >= 25) out.push({ label: 'High-scoring game', tone: 'good', detail: `Implied team total ${p.itt.toFixed(1)} points.` });
    else if (p.itt <= 19) out.push({ label: 'Low-scoring game', tone: 'bad', detail: `Implied team total just ${p.itt.toFixed(1)} points.` });
  }
  if (p.moved) out.push({ label: 'New team', tone: 'warn', detail: `Changed teams since last season${p.team_prev?` (was ${p.team_prev})`:''}; usage pulled toward a positional baseline.` });
  if (p.projected) out.push({ label: 'Role projection', tone: 'warn', detail: 'No 2026 snaps yet -- estimated from his depth-chart role.' });
  if (p.games && p.games <= 2 && !p.projected) out.push({ label: 'Small sample', tone: 'warn', detail: `Only ${p.games} game${p.games===1?'':'s'} tracked this season.` });
  if (!out.length) out.push({ label: 'Limited signal', tone: 'warn', detail: 'Not enough data yet to flag anything specific -- check the season profile below.' });
  return out;
}

  return <span className={'rchip ' + r.tone} title={r.detail}>{r.label}</span>;

        <div className="tagrow">
          <span className="tag">first TD {Math.round((p.prob_first||0)*100)}%</span>
          <span className="tag">2+ TDs {Math.round((p.prob_two||0)*100)}%</span>
          {p.role && <span className="tag">{p.role}</span>}
        </div>
        {m && m.defY!=null && (
          <div className="dk" style={{marginTop:10}}>
            {DATA.meta.season}, from the Team Stats tab: <b style={{color:'var(--ink2)'}}>{p.team}</b> produced {m.offY.toFixed(1)} {m.label} yds/g to {p.pos}s &middot;{' '}
            <b style={{color:'var(--ink2)'}}>{p.next_opp}</b> allowed {m.defY.toFixed(1)}/g
            {m.soft ? ` — ${ord(m.soft)} softest to ${p.pos} in the league` : ''}.
          </div>
        )}
      </div>
    </div>
  );
}

// ============ Reusable checkbox multi-select (Teams / Tags filters) ============
function MultiSelect({ label, options, selected, onToggle, onAll, onNone, allLabel }) {
  const [open, setOpen] = useState(false);
  const n = selected.size;
  const total = options.length;
  const buttonText = n === total ? (allLabel || `All ${label.toLowerCase()}`) : `${n} selected`;
  return (
    <div className="msWrap">
      <button className="msBtn" onClick={()=>setOpen(o=>!o)}>{buttonText}<span className="msChevron">{open?'▴':'▾'}</span></button>
      {open && (
        <>
          <div className="msScrim" onClick={()=>setOpen(false)} />
          <div className="msPanel">
            <div className="msHead">
              <span>{label.toUpperCase()}</span>
              <span className="msHeadLinks">
                <button onClick={onAll}>All</button>&middot;<button onClick={onNone}>None</button>
              </span>
            </div>
            <div className="msList">
              {options.map(o => (
                <label className="msRow" key={o.value}>
                  <input type="checkbox" checked={selected.has(o.value)} onChange={()=>onToggle(o.value)} />
                  <span>{o.label}</span>
                </label>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

  { value: 'Goal-line role', label: 'Goal-line role' },
  { value: 'Red-zone volume', label: 'Red-zone volume' },
  { value: 'Proven scorer', label: 'Proven scorer' },
  { value: 'Soft matchup', label: 'Soft matchup' },
  { value: 'Tough matchup', label: 'Tough matchup' },
  { value: 'High-scoring game', label: 'High-scoring game' },
  { value: 'Low-scoring game', label: 'Low-scoring game' },
  { value: 'New team', label: 'New team' },
  { value: 'Role projection', label: 'Role projection' },
